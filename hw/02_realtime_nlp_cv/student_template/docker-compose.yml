# Стек ДЗ: Triton + vLLM + gateway + Prometheus + node-exporter — СКЕЛЕТ.
# Сервисы triton/vllm/gateway допишите сами (# TODO). Обе модели делят один GPU.
name: hw-realtime-inference

services:
  triton:
    # TODO: image — Triton 24.06 через зеркало NGC по digest (см. ЗАДАНИЕ.md, раздел 2),
    #       command (tritonserver --model-repository=/models, загрузить
    #       только модель варианта ${CV_MODEL}, метрики на :8002 вкл. GPU-метрики),
    #       проброс GPU (deploy.resources.reservations.devices, driver nvidia).
    image: nvcr.nju.edu.cn/nvidia/tritonserver@sha256:153d3158d96346bc50df7fa6e1c3a96d6dc638249072be20ebbbcae07b8505ca
    platform: linux/amd64
    gpus: all
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - "--load-model=${CV_MODEL}"
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./model_repository:/models
    shm_size: "2gb"
    restart: unless-stopped

  vllm:
    # TODO: image (vLLM — закрепите версию, не latest), command (--model,
    #       --served-model-name ${LLM_MODEL}, --gpu-memory-utilization, --max-model-len), проброс GPU.
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    gpus: all
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    restart: unless-stopped
    ports:
      - "8003:8000"
    command:
      - --model
      - Qwen/Qwen2.5-1.5B-Instruct
      - --served-model-name
      - "${LLM_MODEL}"
      - --gpu-memory-utilization
      - "0.60"
      - --max-model-len
      - "2048"


  gateway:
    build: ./gateway
    # TODO: environment — JWT_SECRET (обязателен), CV_MODEL, TRITON_URL, VLLM_URL, адреса
    #       метрик, GPU_NAME, данные студента. Порт наружу (внутри 8080).
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      CV_MODEL: "${CV_MODEL}"
      LLM_MODEL: "${LLM_MODEL}"

      TRITON_URL: "triton:8000"
      VLLM_URL: "http://vllm:8000"

      TRITON_METRICS_URL: "http://triton:8002/metrics"
      VLLM_METRICS_URL: "http://vllm:8000/metrics"
      NODE_METRICS_URL: "http://node-exporter:9100/metrics"

      GPU_NAME: "${GPU_NAME:-NVIDIA GeForce RTX 3080}"
      STUDENT_NAME: "${STUDENT_NAME}"
      STUDENT_EMAIL: "${STUDENT_EMAIL}"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - triton
      - vllm
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    ports:
      - "9100:9100"
    restart: unless-stopped

volumes:
  hf_cache:
  prometheus_data:
